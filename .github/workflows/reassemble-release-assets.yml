name: Reassemble release assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reassemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v2026.10.23-nuxu-assets-v1.0
    steps:
      - name: Download all release parts
        run: |
          mkdir -p parts output
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir parts \
            --pattern 'nuxu_full_project_20261023.zip.part-*' \
            --pattern 'visual_asset_handbook_20261023.pptx.part-*'

      - name: Check part counts
        run: |
          test "$(find parts -maxdepth 1 -name 'nuxu_full_project_20261023.zip.part-*' | wc -l)" -eq 29
          test "$(find parts -maxdepth 1 -name 'visual_asset_handbook_20261023.pptx.part-*' | wc -l)" -eq 8

      - name: Reassemble original files
        run: |
          LC_ALL=C cat parts/nuxu_full_project_20261023.zip.part-* > output/nuxu_full_project_20261023.zip
          LC_ALL=C cat parts/visual_asset_handbook_20261023.pptx.part-* > output/visual_asset_handbook_20261023.pptx

      - name: Verify SHA-256
        working-directory: output
        run: |
          printf '%s  %s\n' \
            'd119ad9471cd5131b96ab9ef6edf199ab01dc14d292ea930757b3fcc947b7ece' \
            'nuxu_full_project_20261023.zip' \
            '99a0d57f200f284e979111286a7dec3834fe03d87d44ae6c1eb0695ba2bdcef2' \
            'visual_asset_handbook_20261023.pptx' | sha256sum --check --strict

      - name: Upload one-click files to the draft release
        run: |
          gh release upload "$RELEASE_TAG" output/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Remove temporary parts from the release
        run: |
          for asset in parts/*; do
            gh release delete-asset "$RELEASE_TAG" "$(basename "$asset")" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          done
