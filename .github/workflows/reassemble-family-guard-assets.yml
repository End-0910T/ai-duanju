name: Reassemble Family Guard complete assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v2026.11.16-family-guard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download manifest and verified temporary transport parts
        run: |
          mkdir -p parts output
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir parts --pattern 'release-manifest.json' --pattern '*.part-*'
      - name: Assemble and verify the complete project
        shell: python
        run: |
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('parts');output=pathlib.Path('output');records=json.loads((root/'release-manifest.json').read_text());assert len(records)==4
          for r in records:
              if r.get('transport')=='derived':continue
              name=r['name'];prefix=r['part_prefix'];assert pathlib.Path(name).name==name and pathlib.Path(prefix).name==prefix
              pieces=sorted(root.glob(prefix+'.part-*'));assert [p.name for p in pieces]==[prefix+f'.part-{i:03d}' for i in range(r['parts'])]
              target=output/name;digest=hashlib.sha256();size=0
              with target.open('wb') as dest:
                  for piece in pieces:
                      with piece.open('rb') as src:
                          for block in iter(lambda:src.read(1048576),b''):
                              dest.write(block);digest.update(block);size+=len(block)
              assert size==r['bytes'] and digest.hexdigest()==r['sha256'],name
              with zipfile.ZipFile(target) as z:assert z.testzip() is None
              print('FULL PROJECT PASS',name,size,digest.hexdigest())
      - name: Derive and verify scene archive review archive and embedded catalog
        run: python .github/scripts/derive-family-guard-packages.py --manifest parts/release-manifest.json --archive-dir output --output-dir output
      - name: Upload four complete downloads without publishing the draft
        run: gh release upload "$RELEASE_TAG" output/* --repo "$GITHUB_REPOSITORY"
      - name: Remove only this delivery's verified temporary parts
        shell: python
        run: |
          import json,os,pathlib,subprocess
          records=json.loads(pathlib.Path('parts/release-manifest.json').read_text());valid={r['part_prefix']+f'.part-{i:03d}' for r in records for i in range(r['parts'])}
          repo=os.environ['GITHUB_REPOSITORY'];tag=os.environ['RELEASE_TAG'];assets=json.loads(subprocess.check_output(['gh','release','view',tag,'--repo',repo,'--json','assets']))['assets']
          for a in assets:
              if a['name'] in valid:subprocess.run(['gh','api','--method','DELETE',a['apiUrl']],check=True)
          print('Verified transport parts removed; complete downloads retained')
