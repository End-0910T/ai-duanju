name: Reassemble widow-daughter release assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reassemble:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v2026.11.02-widow-daughter
      FULL_FILE: widow_eighteen_years_full_archive_20261102.zip
      PRODUCTION_FILE: widow_eighteen_years_production_package_20261102.zip
      REVIEW_FILE: widow_eighteen_years_review_package_20261102.zip
    steps:
      - name: Download temporary release parts
        run: |
          mkdir -p parts output
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir parts \
            --pattern "${FULL_FILE}.part-*" \
            --pattern "${PRODUCTION_FILE}.part-*" \
            --pattern "${REVIEW_FILE}.part-*"

      - name: Check part counts
        run: |
          test "$(find parts -maxdepth 1 -name "${FULL_FILE}.part-*" | wc -l)" -eq 105
          test "$(find parts -maxdepth 1 -name "${PRODUCTION_FILE}.part-*" | wc -l)" -eq 68
          test "$(find parts -maxdepth 1 -name "${REVIEW_FILE}.part-*" | wc -l)" -eq 12

      - name: Reassemble one-click archives
        run: |
          LC_ALL=C cat parts/${FULL_FILE}.part-* > output/$FULL_FILE
          LC_ALL=C cat parts/${PRODUCTION_FILE}.part-* > output/$PRODUCTION_FILE
          LC_ALL=C cat parts/${REVIEW_FILE}.part-* > output/$REVIEW_FILE

      - name: Verify SHA-256 and ZIP integrity
        working-directory: output
        run: |
          printf '%s  %s\n' \
            '5eb5b5349980b800aa6fc32e2458a39486e412a3080474080994af1a92580d0c' \
            "$FULL_FILE" \
            '5bee45c4871aa709b531d798206cdb080c81f42edeecaba202c9743063c56b43' \
            "$PRODUCTION_FILE" \
            'b2edccef1f7308dafc76febf28b64208d574604c2c6a6a4cc80111b34a9e3846' \
            "$REVIEW_FILE" | sha256sum --check --strict
          unzip -tq "$FULL_FILE"
          unzip -tq "$PRODUCTION_FILE"
          unzip -tq "$REVIEW_FILE"

      - name: Upload final one-click files
        run: |
          gh release upload "$RELEASE_TAG" output/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Delete temporary parts
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name | test("\\.part-[0-9]+$")) | .apiUrl' \
            | while read -r asset_url; do
                gh api --method DELETE "$asset_url"
              done
