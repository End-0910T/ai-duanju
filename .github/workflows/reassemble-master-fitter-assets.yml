name: Reassemble Master Fitter complete assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v2026.11.18-master-fitter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download manifest and verified temporary transport parts
        run: |
          mkdir -p parts output
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir parts --pattern 'release-manifest.json' --pattern '*.part-*'
      - name: Assemble and verify the complete project
        shell: python
        run: |
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('parts');output=pathlib.Path('output');records=json.loads((root/'release-manifest.json').read_text());assert len(records)==4
          for r in records:
              if r.get('transport')=='derived':continue
              name=r['name'];prefix=r['part_prefix'];assert pathlib.Path(name).name==name and pathlib.Path(prefix).name==prefix
              pieces=sorted(root.glob(prefix+'.part-*'));assert [p.name for p in pieces]==[prefix+f'.part-{i:03d}' for i in range(r['parts'])]
              target=output/name;digest=hashlib.sha256();size=0
              with target.open('wb') as dest:
                  for piece in pieces:
                      with piece.open('rb') as src:
                          for block in iter(lambda:src.read(1048576),b''):
                              dest.write(block);digest.update(block);size+=len(block)
              assert size==r['bytes'] and digest.hexdigest()==r['sha256'],name
              with zipfile.ZipFile(target) as z:assert z.testzip() is None
              print('FULL PROJECT PASS',name,size,digest.hexdigest())
      - name: Derive and verify image archive review archive and embedded catalog
        run: python .github/scripts/derive-master-fitter-packages.py --manifest parts/release-manifest.json --archive-dir output --output-dir output
      - name: Upload four complete downloads without publishing the draft
        shell: python
        run: |
          import json,os,pathlib,re,subprocess
          records=json.loads(pathlib.Path('parts/release-manifest.json').read_text());dest=pathlib.Path('upload');dest.mkdir(exist_ok=True)
          repo=os.environ['GITHUB_REPOSITORY'];tag=os.environ['RELEASE_TAG']
          assets={a['name']:a for a in json.loads(subprocess.check_output(['gh','release','view',tag,'--repo',repo,'--json','assets']))['assets']}
          for r in records:
              name=r['cloud_name'];assert re.fullmatch(r'[a-z0-9_.]+',name)
              if name in assets:
                  assert assets[name]['size']==r['bytes'];continue
              target=dest/name;os.link(pathlib.Path('output')/r['name'],target)
              subprocess.run(['gh','release','upload',tag,str(target),'--repo',repo],check=True)
          print('Four uniquely named complete downloads uploaded')
      - name: Remove only this delivery's verified temporary parts
        shell: python
        run: |
          import json,os,pathlib,subprocess
          records=json.loads(pathlib.Path('parts/release-manifest.json').read_text());valid={r['part_prefix']+f'.part-{i:03d}' for r in records for i in range(r['parts'])}
          repo=os.environ['GITHUB_REPOSITORY'];tag=os.environ['RELEASE_TAG'];assets=json.loads(subprocess.check_output(['gh','release','view',tag,'--repo',repo,'--json','assets']))['assets']
          releases=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases?per_page=100']))
          release=next(r for r in releases if r['tag_name']==tag);assert release['draft'] is True
          actual=[a for page in json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',f'repos/{repo}/releases/{release["id"]}/assets?per_page=100'])) for a in page]
          by={a['name']:a for a in actual}
          for r in records:
              a=by[r['cloud_name']];assert a['size']==r['bytes'] and a['digest']=='sha256:'+r['sha256'],r['cloud_name']
          print('Four cloud sizes and SHA256 digests verified before cleanup')
          for a in actual:
              if a['name'] in valid:subprocess.run(['gh','api','--method','DELETE',a['url']],check=True)
          print('Verified transport parts removed; complete downloads retained')
