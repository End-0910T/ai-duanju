name: Reassemble Ganshan Yangjia complete assets
on:
  workflow_dispatch:
    inputs:
      transport_commit:
        description: Exact commit of this project's encrypted transport
        required: true
      release_id:
        description: Draft release ID for this project
        required: true
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ inputs.release_id }}
      TRANSPORT_COMMIT: ${{ inputs.transport_commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate revision inputs
        shell: python
        run: |
          import os,re
          assert re.fullmatch('[0-9]+',os.environ['RELEASE_ID'])
          assert re.fullmatch('[a-f0-9]{40}',os.environ['TRANSPORT_COMMIT'])
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.transport_commit }}
          path: parts
          persist-credentials: false
          fetch-depth: 1
      - name: Verify encrypted transport and restore complete ZIP
        shell: python
        run: |
          import hashlib,json,os,pathlib,re,subprocess,zipfile
          root=pathlib.Path('parts');out=pathlib.Path('output');out.mkdir(exist_ok=True)
          records=json.loads((root/'release-manifest.json').read_text());assert len(records)==4
          r=next(x for x in records if x['kind']=='full_project');assert r['encryption']=='AES-256-CTR'
          assert r['name']=='ganshan_yangjia_full_project_20261125.zip'
          prefix=r['part_prefix'];assert prefix=='ganshan-yangjia-full-20261125'
          pieces=sorted(root.glob(prefix+'.part-*'));assert [p.name for p in pieces]==[prefix+f'.part-{i:03d}' for i in range(r['parts'])]
          cipher=pathlib.Path('encrypted.aes');digest=hashlib.sha256();size=0
          with cipher.open('wb') as dest:
              for piece in pieces:
                  with piece.open('rb') as src:
                      for b in iter(lambda:src.read(1048576),b''):dest.write(b);digest.update(b);size+=len(b)
          assert size==r['bytes'] and digest.hexdigest()==r['cipher_sha256']
          release=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/{os.environ["RELEASE_ID"]}']))
          assert release['draft'] is True and release['name']=='赶山养家，从娶媳妇开始｜全60集｜316张视觉资产'
          match=re.search(r'<!-- ganshan-yangjia-key:([a-f0-9]{64}):([a-f0-9]{32}) -->',release['body']);assert match
          key,iv=match.groups();print('::add-mask::'+key);print('::add-mask::'+iv)
          target=out/r['name'];result=subprocess.run(['openssl','enc','-d','-aes-256-ctr','-K',key,'-iv',iv,'-in',str(cipher),'-out',str(target)],capture_output=True)
          assert result.returncode==0,'Transport decryption failed'
          h=hashlib.sha256()
          with target.open('rb') as f:
              for b in iter(lambda:f.read(1048576),b''):h.update(b)
          assert target.stat().st_size==r['bytes'] and h.hexdigest()==r['sha256']
          with zipfile.ZipFile(target) as z:assert z.testzip() is None
          cipher.unlink();print('COMPLETE ZIP SHA256 PASS',r['sha256'])
      - name: Derive and verify images ZIP and embedded catalog
        run: python .github/scripts/derive-ganshan-yangjia-packages.py --manifest parts/release-manifest.json --archive-dir output --output-dir output
      - name: Upload four complete downloads and metadata
        shell: python
        run: |
          import json,os,pathlib,re,subprocess
          repo=os.environ['GITHUB_REPOSITORY'];rid=os.environ['RELEASE_ID'];records=json.loads(pathlib.Path('parts/release-manifest.json').read_text())
          release=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/{rid}']));assert release['draft'] is True
          tag=release['tag_name'];assets={a['name']:a for a in release['assets']}
          for r in records:
              name=r['cloud_name'];assert re.fullmatch(r'[a-z0-9_.]+',name)
              if name in assets:assert assets[name]['size']==r['bytes'] and assets[name]['digest']=='sha256:'+r['sha256'];continue
              subprocess.run(['gh','release','upload',tag,str(pathlib.Path('output')/r['name']),'--repo',repo],check=True)
          subprocess.run(['gh','release','upload',tag,'parts/release-manifest.json','parts/DOWNLOAD_GUIDE.md','parts/SHA256SUMS_RELEASE.txt','--repo',repo,'--clobber'],check=True)
      - name: Verify cloud files and remove the temporary recovery key
        shell: python
        run: |
          import json,os,pathlib,re,subprocess
          repo=os.environ['GITHUB_REPOSITORY'];rid=os.environ['RELEASE_ID'];records=json.loads(pathlib.Path('parts/release-manifest.json').read_text())
          release=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/{rid}']));assert release['draft'] is True
          assets=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/{rid}/assets?per_page=100']));by={a['name']:a for a in assets}
          assert len(assets)==7 and not any('.part-' in a['name'] for a in assets)
          for r in records:
              a=by[r['cloud_name']];assert a['state']=='uploaded' and a['size']==r['bytes'] and a['digest']=='sha256:'+r['sha256'],r['cloud_name']
          body=re.sub(r'\n?<!-- ganshan-yangjia-key:[a-f0-9]{64}:[a-f0-9]{32} -->\n?','',release['body'])
          result=subprocess.run(['gh','api',f'repos/{repo}/releases/{rid}','--method','PATCH','--input','-'],input=json.dumps({'body':body}),capture_output=True,text=True);assert result.returncode==0,'Cannot clear temporary recovery key'
          print('Four complete downloads and three metadata files verified; temporary key removed; draft preserved')
